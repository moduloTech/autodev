---
fr:
  processing_started: ":robot: %{tag} : traitement en cours..."
  mr_created: ":white_check_mark: %{tag} : MR creee : %{mr_url}"
  error_generic: ":x: %{tag} : echec — %{error}"
  spec_unclear_header: ":thinking: %{tag} : la specification necessite des precisions avant implementation."
  spec_unclear_footer: Merci de repondre a ces questions dans les commentaires. L'implementation reprendra automatiquement.
  question_answered_header: ":mag: %{tag} : reponse a la question"
  question_answered_footer: _Cette reponse a ete generee automatiquement par analyse du codebase. N'hesitez pas a demander des precisions._
  mr_fix_success: ":wrench: %{tag} : %{count} commentaire(s) de review corrige(s) sur %{mr_url} (round %{round})"
  mr_fix_error: ":x: %{tag} : echec correction MR — %{error}"
  pipeline_fix_error: ":x: %{tag} : echec de la correction du pipeline — %{error}"
  pipeline_fix_success: ":wrench: %{tag} : correction du pipeline appliquee sur %{mr_url} — %{count} job(s) corrige(s) (round %{round})"
  review_limit_reached: ":warning: %{tag} : la limite de review (3 tours) est atteinte pour %{mr_url}. Les discussions non resolues restantes necessitent une intervention manuelle."
  review_failures_exhausted: ":warning: %{tag} : la review a echoue %{count} fois consecutives sur %{mr_url}. Intervention manuelle requise (binaire ou skill de review, jeton, ou MR en cause)."
  stagnation_pipeline: ":warning: %{tag} : stagnation detectee — les memes jobs echouent de maniere repetee sur %{mr_url}. Job(s) en cause : %{detail}. Intervention manuelle requise."
  stagnation_discussions: ":warning: %{tag} : stagnation detectee — les memes discussions restent non resolues sur %{mr_url}. Intervention manuelle requise."
  pipeline_watch_expired: ":warning: %{tag} : je surveille la pipeline de %{mr_url} depuis plus de %{days} jours sans jamais pouvoir conclure — j'arrete de la surveiller. La MR reste ouverte ; a reprendre a la main."
  mr_closed_unmerged: ":warning: %{tag} : la MR %{mr_url} a ete fermee sans etre fusionnee — rien n'a ete livre, j'arrete de suivre cette demande. Si le travail doit etre repris, remettez le label de depart et reassignez-moi."
  review_skill_missing: ":warning: %{tag} : le projet declare le skill de revue `%{skill}`, mais `%{path}` est absent du depot sur la branche `%{ref}` (la branche cible de %{mr_url}, celle dans laquelle elle va etre fusionnee, et donc celle qui fait foi pour sa revue). Je refuse de basculer sur le binaire mr-review, qui lancerait un autre processus que celui declare : j'arrete de suivre cette demande. Corrigez `review_skill` ou la branche cible dans la configuration du projet, ou ajoutez le skill sur `%{ref}`, puis remettez le label de depart et reassignez-moi."
  target_branch_missing: ":warning: %{tag} : la branche cible de %{mr_url} est `%{branch}`, et le depot ne la porte plus (constate %{count} fois pour cette branche). Sans base, rien ne peut etre rebase ni mesure : j'arrete de suivre cette demande. Retargetez la merge request sur une branche existante, ou restaurez `%{branch}`, puis remettez le label de depart et reassignez-moi."
  review_findings_unanchored: ":warning: %{tag} : j'ai relu %{mr_url} et la revue demande des corrections, mais aucun de ses constats n'a pu etre ancre sur le diff (GitLab a refuse la position, ou le constat n'en portait pas). Les constats sont dans le commentaire de synthese de la merge request, en texte : aucun fil de discussion ne les porte, donc rien ne les suivra et je ne peux pas annoncer cette merge request comme relue. J'arrete de suivre cette demande : traitez les constats, rendez la merge request ancrable, puis remettez le label de depart et reassignez-moi."
  gitlab_refused_request: ":warning: %{tag} : GitLab refuse l'appel `%{what}` que je dois faire sur %{mr_url} — HTTP %{status}, %{count} fois avec la meme reponse. La requete est correcte de mon cote et la reponse ne changera pas d'elle-meme : j'arrete de suivre cette demande. Je ne diagnostique pas la cause a votre place, je vous rapporte ce que GitLab repond : %{answer}. Corrigez ce que GitLab refuse, puis remettez le label de depart et reassignez-moi."
  abandon_reassigned: ":arrow_right: Je t'ai reassigne le ticket : autodev ne le suit plus. A toi de reprendre la main sur la MR."
  unassigned_stop: |-
    :stop_sign: %{tag} : j'ai ete desassigne de ce ticket, j'arrete le travail en cours.

    :arrow_right: **Vous souhaitez que je reprenne ?** Remettez le label _%{label_todo}_ et reassignez-moi.
  handover_doing_removed: |-
    :stop_sign: %{tag} : le label _%{label}_ a ete retire par quelqu'un d'autre, j'arrete le travail en cours.

    :arrow_right: **C'etait une erreur ?** Remettez le label _%{label_todo}_ et reassignez-moi.
  handover_done_added: |-
    :stop_sign: %{tag} : le label _%{label}_ a ete pose par quelqu'un d'autre, j'arrete le travail en cours.

    :arrow_right: **C'etait une erreur ?** Remettez le label _%{label_todo}_ et reassignez-moi.
  handover_workflow_moved: |-
    :stop_sign: %{tag} : ce ticket est passe au label _%{label}_, j'arrete le travail en cours.

    :arrow_right: **C'etait une erreur ?** Remettez le label _%{label_todo}_ et reassignez-moi.
  done_nominal: |-
    :checkered_flag: %{tag} : j'ai termine mon travail sur ce ticket !

    :arrow_right: **Vous souhaitez que je corrige ou ameliore quelque chose ?** Pas de souci ! Remettez le label _%{label_todo}_, reassignez-moi sur le ticket, et je m'en occupe.

    :arrow_right: **Tout est bon ?** Vous pouvez passer a la suite.
  done_question: |-
    :checkered_flag: %{tag} : j'ai termine mon investigation !

    :arrow_right: **Vous souhaitez creuser davantage ou passer a une implementation ?** Laissez un commentaire pour me guider, remettez le label _%{label_todo}_, reassignez-moi, et c'est parti.
  review_summary: "<!-- autodev:review -->\n:mag: **autodev** — revue automatique (verdict : %{verdict})\n\n%{summary}"
