en:
  cli_numeric_settings_rejected_header: "%{count} numeric setting(s) out of bounds: the protection they drive may be neutralised."
  cli_numeric_setting_out_of_range: "%{project}: '%{field}' = %{value} is out of bounds (expected an integer between %{min} and %{max})."
  cli_numeric_setting_not_a_number: "%{project}: '%{field}' = %{value} is not an integer (expected between %{min} and %{max})."
  cli_mr_review_missing: "mr-review is not installed: the review step will be skipped for the projects that declare no `review_skill`."
  cli_boot_guard_reaped_orphan: "Found an orphaned process at boot: %{name} (pid=%{pid}), a child of a previous supervisor whose process group %{pgid} has lost its leader, holding %{db_path} open. Stopping it (TERM)."
  cli_boot_guard_foreign_holder: "Another process is holding %{db_path} (pid=%{pid}, command: %{command}). Autodev cannot identify it as one of its own: continuing to start, but check that process if behaviour looks wrong."
  cli_boot_guard_unrecognized_holder: "An unrecognised process is holding %{db_path} (pid=%{pid}, command: %{command}). Refusing to start (strict mode) — check and stop that process by hand before restarting autodev."
