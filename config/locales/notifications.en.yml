---
en:
  processing_started: ":robot: %{tag}: processing in progress..."
  mr_created: ":white_check_mark: %{tag}: MR created: %{mr_url}"
  error_generic: ":x: %{tag}: failed — %{error}"
  spec_unclear_header: ":thinking: %{tag}: the specification needs clarification before implementation."
  spec_unclear_footer: Please answer these questions in the comments. Implementation will resume automatically.
  question_answered_header: ":mag: %{tag}: answer to the question"
  question_answered_footer: _This answer was generated automatically by analyzing the codebase. Feel free to ask for more details._
  mr_fix_success: ":wrench: %{tag}: %{count} review comment(s) fixed on %{mr_url} (round %{round})"
  mr_fix_error: ":x: %{tag}: MR fix failed — %{error}"
  pipeline_fix_error: ":x: %{tag}: pipeline fix failed — %{error}"
  pipeline_fix_success: ":wrench: %{tag}: pipeline fix applied on %{mr_url} — %{count} job(s) fixed (round %{round})"
  review_limit_reached: ":warning: %{tag}: review limit (3 rounds) reached for %{mr_url}. Remaining unresolved discussions require manual intervention."
  review_failures_exhausted: ":warning: %{tag}: the review failed %{count} times in a row on %{mr_url}. Manual intervention required (the review binary or skill, the token, or the MR itself)."
  stagnation_pipeline: ":warning: %{tag}: stagnation detected — the same jobs keep failing on %{mr_url}. Failing job(s): %{detail}. Manual intervention required."
  stagnation_discussions: ":warning: %{tag}: stagnation detected — the same discussions remain unresolved on %{mr_url}. Manual intervention required."
  fix_rounds_exhausted: ":octagonal_sign: %{tag}: %{rounds} fix rounds on %{mr_url} without concluding, ceiling of %{ceiling} reached. Stopping here: stagnation detection should have ended this long before, so there are two things to look at — the MR, and me. Manual intervention required."
  pipeline_watch_expired: ":warning: %{tag}: I have been watching the pipeline on %{mr_url} for more than %{days} days without ever reaching a verdict — I am no longer watching it. The MR stays open; please take it from here."
  mr_closed_unmerged: ":warning: %{tag}: %{mr_url} was closed without being merged — nothing was delivered, so I am no longer following this request. If the work should be picked up again, put the starting label back and reassign me."
  review_skill_missing: ":warning: %{tag}: the project declares the review skill `%{skill}`, but `%{path}` is missing from the repository on branch `%{ref}` (the branch %{mr_url} is going into, and therefore the one that decides its review). I will not fall back to the mr-review binary, which would run a different process from the one declared, so I am no longer following this request. Fix `review_skill` or the target branch in the project configuration, or add the skill on `%{ref}`, then put the starting label back and reassign me."
  target_branch_missing: ":warning: %{tag}: the target branch of %{mr_url} is `%{branch}`, and the repository no longer carries it (found missing %{count} times for this branch). With no base there is nothing to rebase onto and nothing to measure against, so I am no longer following this request. Retarget the merge request onto a branch that exists, or restore `%{branch}`, then put the starting label back and reassign me."
  review_findings_unanchored: ":warning: %{tag}: I reviewed %{mr_url} and the review asks for changes, but not one of its findings could be anchored to the diff (GitLab refused the position, or the finding carried none). The findings are in the merge request's summary comment, as text: no discussion thread carries them, so nothing will follow them up and I cannot announce this merge request as reviewed. I am no longer following this request: address the findings, make the merge request anchorable again, then put the starting label back and reassign me."
  gitlab_refused_request: ":warning: %{tag}: GitLab keeps refusing the `%{what}` call I have to make on %{mr_url} — HTTP %{status}, %{count} times with the same answer. The request is well formed on my side and the answer does not change on its own, so I am no longer following this request. I am not diagnosing the cause for you, I am reporting what GitLab replies: %{answer}. Fix what GitLab is objecting to, then put the starting label back and reassign me."
  abandon_reassigned: ":arrow_right: I have reassigned the ticket to you: autodev is no longer tracking it. The MR is yours to take over."
  unassigned_stop: |-
    :stop_sign: %{tag}: I was unassigned from this ticket, I'm stopping the work in progress.

    :arrow_right: **Want me to pick it up again?** Put the _%{label_todo}_ label back and reassign me.
  handover_doing_removed: |-
    :stop_sign: %{tag}: the _%{label}_ label was removed by someone else, I'm stopping the work in progress.

    :arrow_right: **Was that a mistake?** Put the _%{label_todo}_ label back and reassign me.
  handover_done_added: |-
    :stop_sign: %{tag}: the _%{label}_ label was applied by someone else, I'm stopping the work in progress.

    :arrow_right: **Was that a mistake?** Put the _%{label_todo}_ label back and reassign me.
  handover_workflow_moved: |-
    :stop_sign: %{tag}: this ticket moved to the _%{label}_ label, I'm stopping the work in progress.

    :arrow_right: **Was that a mistake?** Put the _%{label_todo}_ label back and reassign me.
  done_nominal: |-
    :checkered_flag: %{tag}: I'm done working on this ticket!

    :arrow_right: **Want me to fix or improve something?** No problem! Put the _%{label_todo}_ label back, reassign me to the ticket, and I'll take care of it.

    :arrow_right: **Everything looks good?** You can move on to the next step.
  done_question: |-
    :checkered_flag: %{tag}: I've finished my investigation!

    :arrow_right: **Want to dig deeper or move on to an implementation?** Leave a comment to guide me, put the _%{label_todo}_ label back, reassign me, and I'm on it.
  review_summary: "<!-- autodev:review -->\n:mag: **autodev** — automated review (verdict: %{verdict})\n\n%{summary}"
  arrears_takeover: |-
    :arrows_counterclockwise: %{tag}: I'm taking this ticket back.

    Its merge request %{mr_url} was never reviewed — the review token was dead from April to August 2026, and the request was given up without a single review taking place.

    Our GitLab holds only one assignee per ticket, so I cannot add myself next to you: I'm taking the ticket. **@%{user} I will hand it back to you** as soon as I'm done, or if I stop.

    :arrow_right: **Would you rather keep it?** Assign it back to yourself and I'll stop at the next cycle.
