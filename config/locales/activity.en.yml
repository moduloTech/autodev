---
en:
  activity_header: ":robot: %{tag} — Activity log"
  activity_started: ":rocket: Processing started"
  activity_cloning: ":file_folder: Cloning repository (%{detail})"
  activity_spec_checking: ":mag: Checking specification..."
  activity_spec_clear: ":white_check_mark: Specification clear"
  activity_spec_unclear: ":thinking: Specification needs clarification (%{count} question(s))"
  activity_question_detected: ":grey_question: Question detected, investigating..."
  activity_question_answered: ":speech_balloon: Answer posted"
  activity_implementing: ":gear: Implementation in progress..."
  activity_changes_pushed: ":outbox_tray: Changes pushed to `%{branch}`"
  activity_mr_created: ":twisted_rightwards_arrows: MR created: %{mr_url}"
  activity_mr_closed: ":checkered_flag: MR merged → done"
  activity_reviewing: ":eyes: Running automated review..."
  activity_review_done: ":white_check_mark: Review complete"
  activity_review_failed: ":warning: mr-review failed (%{count} consecutive failure(s))"
  activity_review_failures_exhausted: ":warning: %{count} consecutive mr-review failures → done"
  activity_pipeline_watch: ":hourglass_flowing_sand: Waiting for pipeline result..."
  activity_pipeline_checking: ":mag: Polling pipeline status since %{since}..."
  activity_pipeline_green: ":white_check_mark: Pipeline green"
  activity_pipeline_green_done: ":checkered_flag: Pipeline green, no open discussions → done"
  activity_pipeline_green_discussions: ":speech_balloon: Pipeline green, %{count} open discussion(s) → fixing"
  activity_pipeline_red: ":x: Pipeline failed (%{count} job(s))"
  activity_pipeline_retrigger: ":arrows_counterclockwise: Pipeline retriggered (pre-triage: %{verdict})"
  activity_pipeline_infra: ":warning: Infrastructure failure: %{detail} (waiting)"
  activity_pipeline_evaluating: ":mag: Evaluating failure with Claude..."
  activity_pipeline_fixing: ":wrench: Fixing %{count} job(s) (round %{round})"
  activity_pipeline_fix_pushed: ":outbox_tray: Pipeline fix pushed"
  activity_discussions_checking: ":speech_balloon: Checking MR discussions (round %{round})"
  activity_discussions_found: ":speech_balloon: %{count} unresolved discussion(s)"
  activity_discussion_fixing: ":wrench: Fixing: %{title}"
  activity_discussions_fixed: ":white_check_mark: %{count} discussion(s) fixed (round %{round})"
  activity_discussions_none: ":white_check_mark: No discussions to fix"
  activity_error: ":x: Error: %{error}"
  activity_rate_limit: ":pause_button: Rate limit hit, pausing (%{wait}s)"
  activity_auth_failure: ":no_entry: Claude authentication failed, manual intervention required"
  activity_done: ":checkered_flag: Done"
  activity_post_completion: ":gear: Running post-completion hook..."
  activity_clarification_received: ":incoming_envelope: Clarification received, resuming"
  activity_retry: ":arrows_counterclockwise: Retrying (%{attempt}/%{max})"
  activity_reenter: ":arrows_counterclockwise: Re-entering (todo label detected)"
  activity_reenter_to_fix: ":arrows_counterclockwise: Re-entering (MR open) → checking for unresolved discussions"
  activity_reenter_skipped_merged: ":checkered_flag: Reentry skipped: MR already merged"
  activity_review_limit_reached: ":warning: Review limit reached (3 rounds) → done"
  activity_stagnation_pipeline: ":warning: Pipeline stagnation detected: %{detail} → done"
  activity_stagnation_discussions: ":warning: Discussion stagnation detected → done"
  activity_pipeline_watch_expired: ":hourglass: Pipeline watch stopped after more than %{days} days without a verdict → done"
  activity_mr_closed_unmerged: ":stop_sign: MR closed without being merged, nothing was delivered → done, needs attention"
  activity_unassigned_stop: ":stop_sign: Unassigned, stopping work in progress"
  activity_closed_externally: ":lock: Ticket closed on GitLab, stopping work in progress"
  activity_handover_doing_removed: ":stop_sign: _%{label}_ label removed by someone else, stopping work in progress"
  activity_handover_done_added: ":stop_sign: _%{label}_ label applied by someone else, stopping work in progress"
  activity_handover_workflow_moved: ":stop_sign: Ticket moved to the _%{label}_ label by someone else, stopping work in progress"
  activity_dc_parse_failed: ":warning: danger-claude output not parseable, session reuse disabled for this call"
  activity_dormant_exhausted: ":mag: No restart possible after %{cap} checks, request left as is"
  activity_truncation_marker: "*[older entries truncated to stay below the GitLab note limit]*"
