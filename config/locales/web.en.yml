  web_project_edit_desc_target_branch: "Target branch for merge requests. Default: the repository's default branch (usually master)."
  web_project_edit_desc_labels_todo: GitLab labels that trigger processing by Autodev. One entry per line; required with label_doing and label_done.
  web_project_edit_desc_label_doing: Label set on the issue throughout processing. Required with labels_todo and label_done.
  web_project_edit_desc_label_done: Label set when the issue is delivered (done state). Required with labels_todo and label_doing.
  web_project_edit_desc_label_attention: "Label set when Autodev gives the request up (stagnation, expired watch, review limit, repeated review failures): the request is not delivered and needs a human. Optional; pick a value in the same scope as label_doing / label_done. Default: no end label is set at all, the request stays on label_doing."
  web_project_edit_desc_review_skill: "The project's review skill, loaded from the repo's .claude/skills/ (e.g. mr-review, prepare-mr). Empty: the mr-review binary is used."
  web_project_edit_desc_extra_prompt: "Extra instructions injected into the danger-claude prompts. Default: none."
  web_project_edit_desc_dc_timeout: Maximum time for a single danger-claude call, in seconds.
  web_project_edit_desc_max_retries: Maximum number of attempts on an issue after a failure.
  web_project_edit_desc_retry_backoff: Base delay between two attempts, in seconds.
  web_project_edit_desc_stagnation_threshold: Number of consecutive identical failures (pipeline or discussions) before giving up.
  web_project_edit_desc_clone_depth: Git clone depth (0 = full history clone).
  web_project_edit_desc_sparse_checkout: "Paths to fetch via sparse checkout (handy for monorepos). One entry per line. Default: full clone."
  web_project_edit_desc_post_completion: "Command run after a green pipeline (Docker CMD format). One entry per line. Default: no hook."
  web_project_edit_desc_post_completion_timeout: Maximum time for the post_completion command, in seconds.
  web_project_edit_desc_mr_review_timeout: Maximum time for a single MR review, whichever path runs it (the mr-review binary or the project's review skill), in seconds. Past it the review is killed and counted as a failure.
  web_project_edit_desc_model: "danger-claude model (-m option). Default: danger-claude's default model."
  web_project_edit_desc_effort: "danger-claude reasoning effort (-e option). Default: danger-claude's default effort."
  web_project_edit_desc_parallel_agents: Split complex issues across multiple agents in parallel (git worktrees).
  web_project_edit_desc_split_implementation: Implement the code, then the tests, in two separate danger-claude passes.
  web_project_edit_desc_implementer_agent: "Agent used for implementation (name or path under .claude/agents). Default: the built-in agent."
  web_project_edit_desc_test_writer_agent: "Agent used for writing tests. Default: the built-in agent."
  web_project_edit_desc_mr_fixer_agent: "Agent used for fixing MR review discussions. Default: the built-in agent."
