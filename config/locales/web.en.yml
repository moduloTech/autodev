  web_errors_cause_attention: Manual intervention required
  web_errors_explain_failure: An error stopped autodev from continuing. Retry the request with "Retry now". If it keeps failing, let the autodev team know — it may be a bug to fix. The technical details below help with diagnosis.
  web_errors_explain_auth: Autodev is no longer connected to Claude (authentication failure). There's no point clicking "Retry now" — the connection has to be restored first. Let the autodev team know.
  web_errors_explain_clarification: Autodev asked a question on the GitLab issue to refine the request and is waiting on your reply before resuming. Answer it in a comment on the GitLab issue ("See the question" button).
  web_errors_explain_post_completion: The post-completion hook failed after delivery. The request is done but the follow-up command exited with an error.
  web_errors_explain_attention_review_limit_reached: The review-round limit (3) was reached. The request is marked delivered but unresolved discussions remain and need manual intervention.
  web_errors_explain_attention_review_failures_exhausted: Automated review failed several times in a row. The request is marked delivered but review could not complete — check the MR manually.
  web_errors_explain_attention_stagnation_pipeline: The pipeline kept failing on the same jobs despite fixes. The request is marked delivered but the MR needs manual intervention.
  web_errors_explain_attention_stagnation_discussions: The same discussions stayed unresolved despite fixes. The request is marked delivered but the MR needs manual intervention.
  web_errors_explain_attention_pipeline_watch_expired: "Autodev watched this request's pipeline for weeks without ever reaching a verdict (never green, never actionably red — waiting on a manual action, canceled, or blocked). It stopped watching. The MR is still open: check the pipeline on GitLab, or close the request if it is no longer relevant."
  web_errors_explain_attention_mr_closed_unmerged: "The merge request was closed without being merged: nothing was delivered and Autodev stopped following the request. The request is handed back to you — decide whether the work should be picked up again (put the starting label back and reassign Autodev) or whether the request is no longer relevant."
  web_errors_explain_attention_dormant_exhausted: The request stopped progressing and the automatic checks could not restart it. It is left as is — check on GitLab whether it is still relevant.
  web_errors_explain_attention_target_branch_missing: "The target branch the request’s merge request points at no longer exists on the repository. Autodev found it missing several times, against the remote itself, before concluding: with no base there is nothing to rebase onto, nothing to measure against and nothing to deliver, and only a human can put that right. So the request is stopped rather than left running — it was re-cloning the repository every cycle with no signal to anybody. Retarget the merge request onto a branch that exists, or restore the deleted branch, then put the starting label back and reassign autodev. A network outage does not produce this diagnosis: autodev only counts the cases where the remote itself answered that it does not carry the branch."
  web_errors_explain_attention_gitlab_refused_request: "GitLab refused the same call, with the same answer, often enough for autodev to stop retrying it. This is not an outage: GitLab replied, promptly, that the request cannot succeed as it is formed — retrying changes nothing, and autodev stops the request instead of paying for the whole cycle again on every poll. The comment posted on the ticket names the call, the HTTP status and quotes GitLab’s answer word for word: autodev does not read the merge request’s own state on this path, so it offers you no diagnosis of its own. The refused call is the first place to look — it may be the publication of a review, or any other read, such as fetching the discussion threads. When it is the publication of a review, the findings are first demoted into one summary comment, and this diagnosis then means even that was refused; for any other call no finding was in play. The count shown is of refusals carrying the same call, the same HTTP status and the same answer; it restarts as soon as any of the three changes — not when a cycle goes well, which neither counts nor clears. Fix what GitLab is objecting to, then put the starting label back and reassign autodev. A network outage or a 5xx never produces this diagnosis: only GitLab refusing the request itself is counted."
  web_errors_explain_attention_review_findings_unanchored: "The review ran and asked for changes, but not one of its findings could be anchored to the merge request’s diff — GitLab refused the position, or the finding carried none. The findings are published, as text, in the merge request’s summary comment; what is missing is the discussion thread that would carry them. And unresolved threads are what autodev decides a delivery on, and nothing else: without them the merge request reads as clean and reviewed, and it was going out under the end label while its verdict asked for changes. So the request is stopped and handed back to its author. A merge request in conflict is where this happens most often — its diff no longer has line positions — but autodev does not diagnose that for you: open the merge request, address the findings in the summary comment, then put the starting label back and reassign autodev. A review that approves never produces this diagnosis: it asks nobody for anything, and its remarks stay remarks."
  web_errors_explain_attention_review_skill_missing: "The project declares a review skill its repository does not carry on the merge request's target branch — the branch it is going into, and never its source branch, or a merge request would supply the rules that judge it. Where no merge request exists yet (the health card, which sweeps projects), the configured target branch answers. Autodev will not replace the skill with the mr-review binary, which would run a different process, so it stops this request. The comment posted on the GitLab ticket names the expected skill, its path and the branch it was looked for on. Until this is fixed every request of the project will stop at the same place — fix “Review skill” or “Target branch” in the project configuration, or add the skill on the target branch."
