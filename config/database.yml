# Rails AR configuration — multi-database since phase C step 5.
#
# Two SQLite files:
#   primary — ~/.autodev/autodev.db. Pool sized to match Puma's thread
#             count (10) so dashboard controllers don't block waiting
#             for a connection, and never below AUTODEV_MAX_WORKERS + 2:
#             each IssueProcessJob thread checks one out while it runs. SQLite still serializes writers at the
#             file level (WAL + busy_timeout=30000ms); the AR pool only
#             governs how many AR connection objects this process holds
#             concurrently, not how many DB writers SQLite tolerates.
#             (The previous pool=2 inherited a constraint from Sequel's
#             `max_connections: 1` contract — Sequel is gone since
#             v1.0.0-alpha.1, the constraint no longer applies.)
#   queue   — Solid Queue's tables (10 of them, all CRUD-heavy) live in a
#             dedicated file so their churn does not share the WAL with the
#             business writes. Pool sized to clear Solid Queue's threads
#             check, which aborts the boot below `max(threads of a worker)
#             + 2` (its loop and its heartbeat): AUTODEV_MAX_WORKERS + 2,
#             plus one slot of headroom, never below 6. With a fixed 6,
#             every max_workers from 5 to the declared 64 aborted the
#             `solid-queue` child (Autodev #139). Migrations live under
#             db/queue_migrate/.
#
# Override paths via the AUTODEV_DB / AUTODEV_QUEUE_DB env vars (the primary
# env var stays unchanged from earlier railsification phases).
#
primary_default: &primary_default
  adapter: sqlite3
  pool: <%= [10, ENV.fetch('AUTODEV_MAX_WORKERS', 3).to_i + 2].max %>
  timeout: 30000

queue_default: &queue_default
  adapter: sqlite3
  pool: <%= [6, ENV.fetch('AUTODEV_MAX_WORKERS', 3).to_i + 3].max %>
  timeout: 30000
  migrations_paths: db/queue_migrate

development:
  primary:
    <<: *primary_default
    database: "<%= ENV.fetch('AUTODEV_DB') { File.expand_path('~/.autodev/autodev.db') } %>"
  queue:
    <<: *queue_default
    database: "<%= ENV.fetch('AUTODEV_QUEUE_DB') { File.expand_path('~/.autodev/autodev_queue.db') } %>"

test:
  primary:
    <<: *primary_default
    database: "<%= ENV.fetch('AUTODEV_DB') { ':memory:' } %>"
  queue:
    <<: *queue_default
    database: "<%= ENV.fetch('AUTODEV_QUEUE_DB') { ':memory:' } %>"

production:
  primary:
    <<: *primary_default
    database: "<%= ENV.fetch('AUTODEV_DB') { File.expand_path('~/.autodev/autodev.db') } %>"
  queue:
    <<: *queue_default
    database: "<%= ENV.fetch('AUTODEV_QUEUE_DB') { File.expand_path('~/.autodev/autodev_queue.db') } %>"
