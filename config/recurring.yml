# Solid Queue recurring tasks (railsification step 5).
#
# AutodevPollJob is the GitLab-discovery tick that replaces the
# `Poller#poll_loop` while-true in `lib/autodev/poller.rb`. The schedule
# is a standard cron expression because Solid Queue's
# `SolidQueue::RecurringTask#ensure_schedule_supported` rejects anything
# that doesn't parse as `Fugit::Cron` (Fugit happens to map small
# "every N seconds" strings to Cron but anything ≥60s falls into
# `EtOrbi::EoTime`, which Solid Queue rejects as
# "Schedule is not a supported recurring schedule").
#
# AUTODEV_POLL_INTERVAL is interpreted as seconds; we round up to the
# nearest minute and emit `*/N * * * *` (cron's minute field). The
# default of 300s = 5min keeps the legacy `poll_interval: 300` cadence.
# Intervals between 60s and 3540s (1..59 min) are supported as-is; for
# longer cadences edit this file directly with hour-level cron syntax.

default: &default
  autodev_poll:
    class: AutodevPollJob
    queue: default
    schedule: "*/<%= [ENV.fetch('AUTODEV_POLL_INTERVAL', '300').to_i / 60, 1].max %> * * * *"
  # Daily GitLab → project_memberships reconciliation (PR2 of the
  # users-rollout chantier; cf. docs/users-rollout.md §3). Login also
  # triggers a per-user sync, so this is the catch-all for revocations
  # that happen between two logins. 03:00 because GitLab is dispo and
  # the box is otherwise idle.
  sync_gitlab_memberships:
    class: SyncGitlabMembershipsJob
    queue: default
    schedule: "0 3 * * *"
  # Hourly project briefing refresh (phase D follow-up). Clones the
  # `staging` branch of every Project, runs danger-claude with a
  # briefing prompt, stores the markdown on `Project.briefing_text`
  # so the AutoSpec chat system prompt has project-aware context
  # without paying clone+LLM latency on every CSM message. Hour 0,
  # minute 0 — staggered from the 03:00 sync and the */5 poll.
  refresh_project_briefings:
    class: RefreshProjectBriefingsJob
    queue: default
    schedule: "0 * * * *"

development:
  # Recurring jobs are intentionally disabled in development so a local
  # `bin/autodev` doesn't act on production tickets while iterating on
  # code. The Solid Queue dispatcher + worker still run, so jobs enqueued
  # by hand are processed normally. Trigger a cycle manually with:
  #
  #   bin/rails runner 'AutodevPollJob.perform_now'
  #   bin/rails runner 'SyncGitlabMembershipsJob.perform_now'
  {}

production:
  <<: *default
  # Keep solid_queue_jobs from growing forever — finished rows older than a
  # day are cleaned up hourly. Not run in development to keep dev DBs small.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Bounds ~/.autodev/log growth: prunes dated JSONL + rotation archives past
  # the retention window and copy-truncates the oversized Rails / supervisor
  # logs (Autodev::LogJanitor). 04:30 — staggered from the 03:00 sync, the
  # hourly briefing, and the */5 poll.
  prune_logs:
    class: LogJanitorJob
    queue: default
    schedule: "30 4 * * *"
  # Bounds activity_events growth: drops the machinery rows (poller / usage /
  # error / heartbeat) past a retention window derived from
  # HealthReport#stuck_active_after — 24 h at default settings
  # (Autodev::ActivityEventJanitor, Autodev #57). Recurring rather than a rake
  # task on purpose: Autodev #53 already shipped the manual one and it cannot
  # bound growth. 04:45 — after prune_logs, staggered from the 03:00 sync, the
  # hourly briefing and the */5 poll.
  prune_activity_events:
    class: PruneActivityEventsJob
    queue: default
    schedule: "45 4 * * *"
  # Discards transient process-lifecycle failures (worker pruned/exited on box
  # sleep or supervisor restart) so they don't accumulate in the "Failed" tab
  # (Autodev::FailedJobReaper). Hourly at minute 18 — staggered from the other
  # cleanups. Real application failures are left untouched.
  reap_transient_failed_jobs:
    class: ReapFailedJobsJob
    queue: default
    schedule: "18 * * * *"
