# Solid Queue recurring tasks (railsification step 5).
#
# AutodevPollJob is the GitLab-discovery tick that replaces the
# `Poller#poll_loop` while-true in `lib/autodev/poller.rb`. The schedule
# is a standard cron expression because Solid Queue's
# `SolidQueue::RecurringTask#ensure_schedule_supported` rejects anything
# that doesn't parse as `Fugit::Cron` (Fugit happens to map small
# "every N seconds" strings to Cron but anything ≥60s falls into
# `EtOrbi::EoTime`, which Solid Queue rejects as
# "Schedule is not a supported recurring schedule").
#
# AUTODEV_POLL_INTERVAL is interpreted as seconds; we round up to the
# nearest minute and emit `*/N * * * *` (cron's minute field). The
# default of 300s = 5min keeps the legacy `poll_interval: 300` cadence.
# Intervals between 60s and 3540s (1..59 min) are supported as-is; for
# longer cadences edit this file directly with hour-level cron syntax.

default: &default
  autodev_poll:
    class: AutodevPollJob
    queue: default
    schedule: "*/<%= [ENV.fetch('AUTODEV_POLL_INTERVAL', '300').to_i / 60, 1].max %> * * * *"

development:
  <<: *default

production:
  <<: *default
  # Keep solid_queue_jobs from growing forever — finished rows older than a
  # day are cleaned up hourly. Not run in development to keep dev DBs small.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
