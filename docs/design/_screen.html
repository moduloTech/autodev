<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Autodev — capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: var(--bg); }
    @keyframes pulse {
      0%   { opacity: 1; transform: scale(1); }
      70%  { opacity: 0.5; transform: scale(1.4); }
      100% { opacity: 1; transform: scale(1); }
    }
    .shell-frame {
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      position: relative;
      height: 100%;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="../primitives.jsx"></script>
  <script type="text/babel" src="../data.jsx"></script>
  <script type="text/babel" src="../screen-dashboard.jsx"></script>
  <script type="text/babel" src="../screen-issues.jsx"></script>
  <script type="text/babel" src="../screen-errors.jsx"></script>
  <script type="text/babel" src="../screen-issue-detail.jsx"></script>
  <script type="text/babel" src="../screen-chat-spec.jsx"></script>
  <script type="text/babel" src="../screen-project.jsx"></script>
  <script type="text/babel" data-presets="react">
    const Screens = {
      dashboard: ScreenDashboard, issues: ScreenIssues, errors: ScreenErrors,
      detail: ScreenIssueDetail, spec: ScreenChatSpec, project: ScreenProject,
    };
    function App() {
      const [s, setS] = React.useState(window.__capState || { which: 'dashboard', theme: 'light', w: 1280 });
      window.__setCap = (next) => { window.__capState = { ...s, ...next }; setS(prev => ({ ...prev, ...next })); };
      const Screen = Screens[s.which] || ScreenDashboard;
      return (
        <ThemeContext.Provider value={{ theme: s.theme, setTheme: t => window.__setCap({ theme: t }) }}>
          <div className="shell-frame" data-theme={s.theme} style={{ width: '100%', height: '100%' }}>
            <ShellSizer width={s.w}><Screen/></ShellSizer>
          </div>
        </ThemeContext.Provider>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
